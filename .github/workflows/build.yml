name: Build Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: x402-checker-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: x402-checker-macos-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: x402-checker-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: x402-checker-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: x402-checker-windows-x64.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p x402-checker

      - name: Prepare binary (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          chmod +x x402-checker
          mv x402-checker ${{ matrix.name }}
          shasum -a 256 ${{ matrix.name }} | cut -d ' ' -f 1 > ${{ matrix.name }}.sha256

      - name: Prepare binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Move-Item x402-checker.exe ${{ matrix.name }}
          (Get-FileHash ${{ matrix.name }} -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline "${{ matrix.name }}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.name }}
            target/${{ matrix.target }}/release/${{ matrix.name }}.sha256

  release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: build
    # A manual run only checks that every target still builds; only a real release has somewhere to put the
    # binaries.
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./binaries/**/*
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
