name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        # Loopback only: the suites run against the reference server and the doubles of the workspace.
        run: cargo nextest run --workspace --all-features --locked

      - name: Check documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check licences and advisories
        run: cargo deny check

      - name: Build
        run: cargo build --release --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.98
        # Cargo.toml claims 1.98 (let chains, is_none_or); the claim is checked against the committed
        # dependency graph rather than trusted.
        run: rustup toolchain install 1.98 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo +1.98 build --workspace --locked
